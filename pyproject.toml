[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "attxnet"
version = "1.0.0"
description = "Bridge surface crack classification with backbone + optional CBAM/CA attention (SDNET-style)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["attxnet*"]
